<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploading Music</title>
    <link rel="stylesheet" href="uploadingMusic.css">
</head>

<body>
    <div class="global-container">
        <div class="header-container">
            <div class="logo-container">
                <img alt="logo_icon" src="./images/uploadingMusic/logo_icon.svg">
                <p>Radar Musical</p>
            </div>
            <!--we have to write the href to a user page-->
            <a href=""><img alt="user_icon" src="./images/uploadingMusic/user_icon.svg"></a>
        </div>
        <div class="main-container">
            <form class="form-container" action="">
                <div class="rectangule-container">
                    <input class="field-image-input" type="file" accept="images">
                </div>
                <div class="upload-data-container">
                    <label class="field-label" for="track_title">Track title</label>
                    <input class="field-text-input" id="track_title" type="text" placeholder="Enter track title">

                    <label class="field-label" for="track_title">Genre</label>
                    <input class="field-text-input" id="track_title" type="text" placeholder="Enter genre track">
                </div>
            </form>
            <div class="buttons-container">
                <button class="publish-button">Publish</button>
                <button class="back-button">Back</button>
            </div>
        </div>
    </div>
</body>

</html>
